name: Build Release EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2.0.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release?'
        type: boolean
        default: false

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pyinstaller -e ".[full]"

      - name: Build EXE
        # Keep the resources inside their real Python package. Both the
        # installed wheel and the frozen executable then resolve the same
        # canonical dumpex/rules_pkg/data layout via importlib.resources.
        # The CLI deliberately uses Unicode evidence/output labels, so force
        # UTF-8 mode for redirected/non-console Windows executions as well.
        run: pyinstaller --onefile dumpex.py --name dumpex --collect-data dumpex.rules_pkg --python-option "X utf8"

      - name: Verify bundled package resources
        shell: pwsh
        run: |
          $archive = (& pyi-archive_viewer -l dist/dumpex.exe) -join "`n"
          $archive = $archive.Replace('\', '/')
          $archive = $archive -replace '/+', '/'
          $required = @(
            'dumpex/rules_pkg/data/rules.yaml',
            'dumpex/rules_pkg/data/yara/cs_indicators.yar',
            'dumpex/rules_pkg/data/yara/lateral_movement.yar',
            'dumpex/rules_pkg/data/yara/suspicious_memory.yar'
          )
          foreach ($resource in $required) {
            if (-not $archive.Contains($resource)) {
              throw "PyInstaller artifact is missing package resource: $resource"
            }
          }
          & .\dist\dumpex.exe --help

      - name: Stage the output-contract schema as a release asset
        # dumpex.exe never reads this file at runtime (only the test suite
        # and external --json consumers validate against it), so it isn't
        # collected into the frozen EXE via --collect-data -- there is
        # nothing for PyInstaller to bundle it FOR. It's shipped instead as
        # a plain, separately downloadable file alongside dumpex.exe, so an
        # EXE-only user (no `pip install dumpex`, no source checkout) can
        # still get the canonical schema for this release without needing
        # the wheel. Validated as JSON here so a corrupted/empty file never
        # ships silently.
        shell: pwsh
        run: |
          python -c "import json; json.load(open('dumpex/schemas/dumpex-output-v1.0.schema.json', encoding='utf-8'))"
          Copy-Item dumpex/schemas/dumpex-output-v1.0.schema.json dist/dumpex-output-v1.0.schema.json

      - name: Create Release and Upload EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Dumpex ${{ github.event.inputs.version }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            dist/dumpex.exe
            dist/dumpex-output-v1.0.schema.json
