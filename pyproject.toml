[build-system]
requires = ["setuptools>=80", "setuptools-scm>=10.2,<11"]
build-backend = "setuptools.build_meta"

[project]
name = "dumpex"
dynamic = ["version"]
description = "Minidump memory extractor and DFIR triage tool"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES", "CREDITS"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    # Pin the minidump version validated by dumpex/core/memory.py. Before
    # widening it, revalidate _handle_descriptor_layout() and run
    # tests/unit/test_handle_stream_parse.py plus the CI version-range gate.
    "minidump>=0.0.24,<0.0.25",
    "colorama>=0.4.6",
    "pyyaml",
]

[project.optional-dependencies]
full = [
    "yara-python",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jsonschema>=4.0",
    "packaging>=24.0",
]

[project.scripts]
dumpex = "dumpex.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dumpex*"]

[tool.setuptools.package-data]
# Canonical rules live in dumpex.rules_pkg and must load from a base install
# through importlib.resources. dumpex/rules_pkg/loader.py's _DEFAULT_RULES
# remains the emergency fallback and must match the packaged rules;
# test_packaged_rules_match_builtin_fallback detects drift.
"dumpex.rules_pkg" = ["data/rules.yaml", "data/yara/*.yar"]
"dumpex.schemas" = ["*.schema.json"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "*.pyo"]

[tool.setuptools_scm]
version_file = "dumpex/_version.py"
fallback_version = "0+unknown"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# No real minidump/PE sample files are required to run this suite — every
# test builds its own synthetic PE header / minidump object graph via
# tests/fixtures/fakes.py, so `pytest` must succeed with nothing beyond
# the repo checkout (no external fixtures, no network, no malware corpus).
addopts = "-ra"

[tool.coverage.run]
source = ["dumpex"]
branch = true

[tool.coverage.report]
# Gate total branch coverage with fail_under. Raise the threshold as real
# coverage improves; never lower it merely to make a pull request pass.
fail_under = 45
show_missing = true
