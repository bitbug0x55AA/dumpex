name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first: nothing is learned from finishing a
# run against a tree that is already stale. main is exempt -- every commit
# that lands there gets its own complete, uncancelled verification.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    # Selects the current verification tier:
    #
    #   skip  branch push already covered by an open PR's merge-ref run.
    #   fast  branch push with no open PR: Ubuntu/Python 3.12, no coverage
    #         or auxiliary gates.
    #   full  pull requests, main pushes, and manual dispatches: full matrix,
    #         coverage, packaging, and minidump compatibility gates.
    #
    # This job is deliberately checkout-free; it is metadata only.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
      os: ${{ steps.pick.outputs.os }}
      python: ${{ steps.pick.outputs.python }}
    steps:
      - name: Pick test tier for this event
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          # Never interpolate a ref straight into a shell script: a branch
          # name is attacker-controllable on a public repo and would be
          # evaluated by bash. Pass it as an environment value instead.
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          mode=full
          if [[ "$EVENT_NAME" == "push" && "$REF" != "refs/heads/main" ]]; then
            # `gh api` fails open here: if the lookup errors we assume no
            # PR and run the fast lane, which is the safe direction (extra
            # signal, never missing signal).
            open_prs="$(gh api \
              --method GET \
              "repos/$REPO/pulls" \
              -f state=open \
              -f "head=$OWNER:$REF_NAME" \
              --jq 'length' 2>/dev/null || echo 0)"

            if [[ "$open_prs" -gt 0 ]]; then
              mode=skip
            else
              mode=fast
            fi
          fi

          case "$mode" in
            full) os='["ubuntu-latest", "windows-latest"]'; python='["3.10", "3.12"]' ;;
            *)    os='["ubuntu-latest"]';                   python='["3.12"]' ;;
          esac

          {
            echo "mode=$mode"
            echo "os=$os"
            echo "python=$python"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Test tier: \`$mode\`"
            echo
            case "$mode" in
              skip) echo "Branch \`$REF_NAME\` has an open pull request; its \`pull_request\` run tests the same commit merged into \`main\`. Nothing to do here." ;;
              fast) echo "Pre-PR push: ubuntu-latest / Python 3.12 only, no coverage gates. Open a pull request for the full matrix." ;;
              full) echo "Full matrix: ubuntu-latest + windows-latest, Python 3.10 + 3.12, coverage gates, packaging and minidump-pin jobs." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  pytest:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # requires-python in pyproject.toml is the floor; one current
        # version stands in for "a main supported runtime". No real
        # .dmp/PE sample files are needed — the suite builds its own
        # synthetic fixtures (see tests/fixtures/fakes.py).
        python-version: ${{ fromJSON(needs.plan.outputs.python) }}
        # Linux and Windows exercise different path, file-locking, and
        # temporary-directory behavior relevant to minidump analysis.
        os: ${{ fromJSON(needs.plan.outputs.os) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Cache downloads only; the editable install still runs on each leg.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dumpex with dev + optional extras
        run: pip install -e ".[dev,full]"

      - name: Hunt CLI golden fixtures up to date (scripts/update_hunt_cli_goldens.py --check)
        # Goldens must remain byte-identical across both operating systems.
        run: python scripts/update_hunt_cli_goldens.py --check

      - name: Untrusted console text — ratchet (new unescaped output fails; existing debt warns)
        # Dump-derived text is attacker-controlled and can forge lines or
        # alter terminal display. Exercise real renderers and fail on any
        # unlisted leak; known debt remains an explicit warning ratchet.
        run: pytest tests/unit/test_console_untrusted_text.py -v -W "always::UserWarning"

      - name: Run pytest (coverage measured on the ubuntu / 3.12 leg only)
        # Only the full-tier Ubuntu/Python 3.12 leg records coverage; the
        # other matrix legs run the same suite without a coverage data file.
        shell: bash
        env:
          COVERAGE_LEG: ${{ needs.plan.outputs.mode == 'full' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        run: |
          set -euo pipefail
          if [[ "$COVERAGE_LEG" == "true" ]]; then
            pytest --cov=dumpex --cov-report=term-missing
          else
            pytest
          fi

      - name: Coverage gate — key detection modules
        # Use the same fail-fast native-command semantics on every runner.
        # PowerShell can otherwise continue after a failing coverage command
        # and report the final command's success, producing a false green job.
        shell: bash
        # `always()` exposes both suite and per-file failures in one run; the
        # leg condition prevents reporting where no .coverage file exists.
        # Raise thresholds as coverage improves; never lower them merely to
        # make a pull request pass.
        if: always() && needs.plan.outputs.mode == 'full' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          coverage report --include="dumpex/core/pe_utils.py"   --fail-under=56
          coverage report --include="dumpex/hunt/_coverage.py"  --fail-under=85
          coverage report --include="dumpex/hunt/_finding.py"   --fail-under=90
          # Keep gates per file so strong coverage in one module cannot mask
          # a regression in another.
          coverage report --include="dumpex/hunt/_domain.py"     --fail-under=95
          coverage report --include="dumpex/hunt/hollowing/__init__.py"       --fail-under=95
          coverage report --include="dumpex/hunt/hollowing/config.py"        --fail-under=95
          coverage report --include="dumpex/hunt/hollowing/models.py"        --fail-under=95
          coverage report --include="dumpex/hunt/hollowing/memory_scan.py"   --fail-under=90
          coverage report --include="dumpex/hunt/hollowing/correlation.py"   --fail-under=95
          coverage report --include="dumpex/hunt/hollowing/aggregate.py"     --fail-under=95
          coverage report --include="dumpex/hunt/hollowing/domain.py"        --fail-under=95
          coverage report --include="dumpex/hunt/hollowing/report_console.py" --fail-under=95
          coverage report --include="dumpex/hunt/hollowing/report_facts.py"   --fail-under=90
          coverage report --include="dumpex/hunt/hollowing/report_legacy.py"  --fail-under=95
          coverage report --include="dumpex/hunt/hollowing/report_record.py"  --fail-under=95
          coverage report --include="dumpex/hunt/encoding/__init__.py"       --fail-under=95
          coverage report --include="dumpex/hunt/encoding/config.py"        --fail-under=95
          coverage report --include="dumpex/hunt/encoding/models.py"        --fail-under=90
          coverage report --include="dumpex/hunt/encoding/classification.py" --fail-under=90
          coverage report --include="dumpex/hunt/encoding/entropy.py"       --fail-under=75
          coverage report --include="dumpex/hunt/encoding/sleep_mask.py"    --fail-under=85
          coverage report --include="dumpex/hunt/encoding/decoding.py"      --fail-under=78
          coverage report --include="dumpex/hunt/encoding/aggregate.py"     --fail-under=90
          coverage report --include="dumpex/hunt/encoding/domain.py"         --fail-under=95
          coverage report --include="dumpex/hunt/encoding/report_console.py" --fail-under=90
          coverage report --include="dumpex/hunt/encoding/report_facts.py"   --fail-under=90
          coverage report --include="dumpex/hunt/encoding/report_legacy.py"  --fail-under=90
          coverage report --include="dumpex/hunt/encoding/report_record.py"  --fail-under=95
          coverage report --include="dumpex/hunt/cs_beacon/__init__.py"     --fail-under=95
          coverage report --include="dumpex/hunt/cs_beacon/config.py"      --fail-under=95
