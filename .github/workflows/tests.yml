name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # requires-python in pyproject.toml is the floor; one current
        # version stands in for "a main supported runtime". No real
        # .dmp/PE sample files are needed — the suite builds its own
        # synthetic fixtures (see tests/fixtures/fakes.py).
        python-version: ["3.10", "3.12"]
        # dumpex parses Windows minidumps and reasons about Windows-
        # specific memory/protection semantics (MEM_IMAGE/MEM_PRIVATE,
        # PAGE_EXECUTE_WRITECOPY, backslash paths in module/PEB records,
        # ...) -- Ubuntu-only CI had never actually run this suite on the
        # platform it targets. Path handling, file-locking/O_EXCL
        # semantics (safe_io), and temp-directory behavior can all differ
        # in ways Linux CI can't catch.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dumpex with dev + optional extras
        run: pip install -e ".[dev,full]"

      - name: Hunt CLI golden fixtures up to date (scripts/update_hunt_cli_goldens.py --check)
        # Runs on both OSes in the matrix -- a console-rendering change
        # made on one platform must produce byte-identical goldens on the
        # other (no OS-specific line-ending/path drift), and this is the
        # cheapest place to catch a forgotten `python scripts/
        # update_hunt_cli_goldens.py` before the parametrized tests in
        # tests/integration/test_hunt_cli_compat_freeze.py fail one
        # scenario at a time with less context.
        run: python scripts/update_hunt_cli_goldens.py --check

      - name: Run pytest with coverage (overall gate — see pyproject.toml [tool.coverage.report])
        run: pytest --cov=dumpex --cov-report=term-missing

      - name: Coverage gate — key detection modules
        # Use the same fail-fast native-command semantics on every runner.
        # PowerShell can otherwise continue after a failing coverage command
        # and report the final command's success, producing a false green job.
        shell: bash
        # Runs even if the overall gate above already failed, so both
        # classes of regression show up in the same CI run instead of
        # needing a second push to discover the per-module one. Targets
        # sit a few points below each module's measured coverage when
        # this was added — raise them as coverage improves, don't lower
        # them to make a failing PR pass. Same thresholds on every OS in
        # the matrix: the modules under test don't branch on platform, so
        # coverage shouldn't either.
        if: always()
        run: |
          coverage report --include="dumpex/core/pe_utils.py"   --fail-under=56
          coverage report --include="dumpex/hunt/_coverage.py"  --fail-under=85
          coverage report --include="dumpex/hunt/_finding.py"   --fail-under=90
          # dumpex/hunt/_domain.py: the canonical hunter-neutral CheckResult
          # and the recursive-immutability guard every migrated Report is
          # validated through. New in this change and pure validation logic
          # with no console/presentation branches, so the gate sits close to
          # its measured coverage from day one.
          coverage report --include="dumpex/hunt/_domain.py"     --fail-under=95
          coverage report --include="dumpex/hunt/hollowing.py"  --fail-under=90
          # dumpex/hunt/encoding/*: encoding.py is a package now, not a
          # single file -- _hunt_encoding (the thin entry point) lives in
          # __init__.py; each scan layer, the aggregation logic, and the
          # console renderer are gated separately so no single file's
          # (deliberately) high coverage can mask another one's gap.
          coverage report --include="dumpex/hunt/encoding/__init__.py"       --fail-under=95
          coverage report --include="dumpex/hunt/encoding/config.py"        --fail-under=95
          coverage report --include="dumpex/hunt/encoding/models.py"        --fail-under=90
          coverage report --include="dumpex/hunt/encoding/classification.py" --fail-under=90
          coverage report --include="dumpex/hunt/encoding/entropy.py"       --fail-under=75
          coverage report --include="dumpex/hunt/encoding/sleep_mask.py"    --fail-under=85
          coverage report --include="dumpex/hunt/encoding/decoding.py"      --fail-under=78
          coverage report --include="dumpex/hunt/encoding/aggregate.py"     --fail-under=90
          coverage report --include="dumpex/hunt/encoding/presentation.py" --fail-under=65
          # dumpex/hunt/cs_beacon/*: same reasoning as encoding/* above --
          # cs_beacon.py is a package now, not a single file. parser.py and
          # presentation.py have low coverage because most Malleable C2/
          # SSH/DNS transport display branches and the --verbose full field
          # table only run against a fully-populated real config, which the
          # unit fixtures deliberately keep minimal.
          coverage report --include="dumpex/hunt/cs_beacon/__init__.py"     --fail-under=95
          coverage report --include="dumpex/hunt/cs_beacon/config.py"      --fail-under=95
          coverage report --include="dumpex/hunt/cs_beacon/schema.py"      --fail-under=95
          coverage report --include="dumpex/hunt/cs_beacon/models.py"      --fail-under=95
          coverage report --include="dumpex/hunt/cs_beacon/der.py"         --fail-under=85
          coverage report --include="dumpex/hunt/cs_beacon/context.py"     --fail-under=85
          coverage report --include="dumpex/hunt/cs_beacon/scanner.py"     --fail-under=80
          coverage report --include="dumpex/hunt/cs_beacon/aggregate.py"   --fail-under=90
          coverage report --include="dumpex/hunt/cs_beacon/parser.py"      --fail-under=30
          coverage report --include="dumpex/hunt/cs_beacon/presentation.py" --fail-under=40
          # dumpex/hunt/injection/*: same reasoning -- injection.py is a
          # package now, not a single file.
          coverage report --include="dumpex/hunt/injection/__init__.py"     --fail-under=95
          coverage report --include="dumpex/hunt/injection/config.py"      --fail-under=95
          coverage report --include="dumpex/hunt/injection/models.py"      --fail-under=95
          # domain.py is the canonical immutable InjectionReport/
          # CoverageSnapshot/InjectionEvidence model the hunter is being
          # migrated onto -- same reasoning as _domain.py above.
          coverage report --include="dumpex/hunt/injection/domain.py"      --fail-under=95
          coverage report --include="dumpex/hunt/injection/correlation.py" --fail-under=80
          coverage report --include="dumpex/hunt/injection/memory_scan.py" --fail-under=80
          coverage report --include="dumpex/hunt/injection/aggregate.py"   --fail-under=80
          coverage report --include="dumpex/hunt/injection/thread_scan.py" --fail-under=70
          coverage report --include="dumpex/hunt/injection/presentation.py" --fail-under=60
          # dumpex/hunt/stomping/*: same reasoning -- stomping.py is a
          # package now, not a single file.
          coverage report --include="dumpex/hunt/stomping/__init__.py"        --fail-under=85
          coverage report --include="dumpex/hunt/stomping/config.py"         --fail-under=95
          coverage report --include="dumpex/hunt/stomping/models.py"         --fail-under=95
          coverage report --include="dumpex/hunt/stomping/correlation.py"    --fail-under=85
          coverage report --include="dumpex/hunt/stomping/aggregate.py"      --fail-under=75
          coverage report --include="dumpex/hunt/stomping/disk_reference.py" --fail-under=70
          coverage report --include="dumpex/hunt/stomping/memory_scan.py"    --fail-under=70
          coverage report --include="dumpex/hunt/stomping/presentation.py"   --fail-under=55
          # dumpex/hunt/pipe/*: same reasoning -- pipe.py is a package now,
          # not a single file.
          coverage report --include="dumpex/hunt/pipe/__init__.py"      --fail-under=95
          coverage report --include="dumpex/hunt/pipe/config.py"       --fail-under=95
          coverage report --include="dumpex/hunt/pipe/models.py"       --fail-under=95
          coverage report --include="dumpex/hunt/pipe/correlation.py"  --fail-under=78
          coverage report --include="dumpex/hunt/pipe/aggregate.py"    --fail-under=78
          coverage report --include="dumpex/hunt/pipe/patterns.py"    --fail-under=75
          coverage report --include="dumpex/hunt/pipe/presentation.py" --fail-under=70
          coverage report --include="dumpex/hunt/pipe/handle_scan.py" --fail-under=70
          coverage report --include="dumpex/hunt/pipe/memory_scan.py" --fail-under=58
          # dumpex/hunt/yara_hunt/*: same reasoning -- yara_hunt.py is a
          # package now, not a single file. context.py's PE_In_Private_Memory
          # classification policy has dedicated coverage
          # (tests/hunt/test_yara_context.py) after a P2 review found it
          # essentially untested despite deciding DETECTED vs. INCONCLUSIVE
          # vs. clean. scanner.py and rules.py gates were raised (from 65
          # and 55) after tests/unit/test_yara_scanner.py added fake-
          # compiled-rule coverage of match() timeout handling, the
          # whole-scan hit cap, and the per-match string-instance cap
          # (measured ~88% branch coverage for both with real yara-python
          # installed) -- still a few points of headroom below that
          # measured baseline, not a hard 100% requirement.
          coverage report --include="dumpex/hunt/yara_hunt/__init__.py"      --fail-under=75
          coverage report --include="dumpex/hunt/yara_hunt/config.py"       --fail-under=95
          coverage report --include="dumpex/hunt/yara_hunt/models.py"       --fail-under=95
          coverage report --include="dumpex/hunt/yara_hunt/aggregate.py"    --fail-under=82
          coverage report --include="dumpex/hunt/yara_hunt/scanner.py"      --fail-under=80
          coverage report --include="dumpex/hunt/yara_hunt/presentation.py" --fail-under=60
          coverage report --include="dumpex/hunt/yara_hunt/rules.py"        --fail-under=80
          coverage report --include="dumpex/hunt/yara_hunt/context.py"      --fail-under=90
          coverage report --include="dumpex/hunt/_context.py"               --fail-under=90
          # dumpex/output/*: the v2 structured-output contract (--list/
          # --modules/--threads/--pid/--sysinfo/--peb). New in this change,
          # so gates sit close to measured coverage from day one rather
          # than starting loose -- records.py/serializer.py are pure data
          # transforms with no console/presentation branches
          # to skip testing.
          coverage report --include="dumpex/output/records.py"       --fail-under=95
          coverage report --include="dumpex/output/serializer.py"    --fail-under=95
          coverage report --include="dumpex/output/envelope.py"      --fail-under=85
          coverage report --include="dumpex/output/collector.py"     --fail-under=80
          # dumpex/output/coverage.py + command_result.py: the first-class
          # coverage/provenance core (SourceObservation, CoverageLimitation,
          # CoverageReport, CommandResult, exit_code_for), validated so far
          # by migrating --list/--modules onto it; table-driven tests cover
          # every source state and both limitation-rendering paths, hence
          # the tight gates.
          coverage report --include="dumpex/output/coverage.py"       --fail-under=95
          coverage report --include="dumpex/output/command_result.py" --fail-under=95
          # dumpex/commands/{list_cmd,modules,threads,sysinfo,peb}.py: the
          # six recon commands' collect_*()/render_*_console() split.
          # collect_*() (the part that matters for --json output) is
          # thoroughly covered; render_*_console()'s console-formatting
          # branches are not chased for coverage the same way presentation
          # modules elsewhere in this file aren't.
          coverage report --include="dumpex/commands/list_cmd.py" --fail-under=90
          coverage report --include="dumpex/commands/modules.py"  --fail-under=80
          coverage report --include="dumpex/commands/threads.py"  --fail-under=65
          coverage report --include="dumpex/commands/sysinfo.py"  --fail-under=70
          coverage report --include="dumpex/commands/peb.py"      --fail-under=90

  package-smoke:
    # The pytest job above always installs dumpex editable (`pip install
    # -e .`), which never exercises setuptools' actual package-data
    # inclusion logic -- an editable install just symlinks/points back at
    # the checkout, so a package-data glob typo'd in pyproject.toml (or a
    # resource that silently stopped being packaged) would never be
    # caught by that job passing. This job builds the real wheel and
    # sdist artifacts, installs each into its own throwaway venv with NO
    # editable/dev install anywhere in the picture, and proves the
    # packaged rules.yaml / YARA rules / JSON schema are actually inside
    # the distributed artifact and readable via importlib.resources --
    # not just present in the source tree.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build

      - name: Copy smoke script outside the checkout
        # The smoke test MUST run from a directory that does not contain a
        # `dumpex/` source folder: Python adds the invoked script's own
        # directory to sys.path ahead of site-packages, so running this
        # script from inside the checkout would silently import the
        # repo's source tree instead of the installed wheel/sdist even if
        # the install itself were broken -- defeating the entire point of
        # this job. See scripts/package_smoke.py's own docstring.
        run: cp scripts/package_smoke.py "$RUNNER_TEMP/package_smoke.py"

      - name: Wheel — install into a fresh venv and run the smoke test
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv "$RUNNER_TEMP/venv-wheel"
          "$RUNNER_TEMP/venv-wheel/bin/pip" install --quiet "$GITHUB_WORKSPACE"/dist/*.whl
          "$RUNNER_TEMP/venv-wheel/bin/python" "$RUNNER_TEMP/package_smoke.py" "$GITHUB_WORKSPACE"

      - name: Sdist — install into a fresh venv and run the smoke test
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv "$RUNNER_TEMP/venv-sdist"
          "$RUNNER_TEMP/venv-sdist/bin/pip" install --quiet "$GITHUB_WORKSPACE"/dist/*.tar.gz
          "$RUNNER_TEMP/venv-sdist/bin/python" "$RUNNER_TEMP/package_smoke.py" "$GITHUB_WORKSPACE"
