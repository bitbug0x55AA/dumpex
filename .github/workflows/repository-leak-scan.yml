name: Repository Leak Scan

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 17 * * 5"

concurrency:
  group: repository-leak-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  leak-scan:
    # Gitleaks below scans `--log-opts=--all`, i.e. every commit reachable in
    # the repository -- not the diff. For a branch in this repository the
    # push event has therefore already scanned exactly what the matching
    # pull_request event would scan, so running both was pure duplication.
    # Fork pull requests are the one case where that is not true: their
    # commits never produce a push event here, so they still get scanned.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce repository privacy boundary
        run: python3 scripts/repo_privacy_scan.py --root .

      - name: Install checksum-pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location "$url" --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan complete Git history for secrets
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" git \
            --log-opts="--all" \
            --no-banner \
            --no-color \
            --redact=100 \
            --timeout=600 \
            .
