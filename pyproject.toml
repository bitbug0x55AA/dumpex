[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dumpex"
version = "2.1.0"
description = "Minidump memory extractor and DFIR triage tool"
requires-python = ">=3.10"
dependencies = [
    "minidump",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
full = [
    "pyyaml",
    "yara-python",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jsonschema>=4.0",
]

[project.scripts]
dumpex = "dumpex.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dumpex*"]

[tool.setuptools.package-data]
# The single canonical copy of the TTP rule defaults / YARA rules — not
# duplicated anywhere else in the repo — so `pip install dumpex` works
# standalone with no rules/ directory living next to whatever script
# invoked it. dumpex/rules_pkg/loader.py and dumpex/hunt/yara_hunt/ both
# resolve this via importlib.resources ahead of any dev-tree/user-override
# path (script dir / cwd).
"dumpex.rules_pkg" = ["data/rules.yaml", "data/yara/*.yar"]
"dumpex.schemas" = ["*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# No real minidump/PE sample files are required to run this suite — every
# test builds its own synthetic PE header / minidump object graph via
# tests/fixtures/fakes.py, so `pytest` must succeed with nothing beyond
# the repo checkout (no external fixtures, no network, no malware corpus).
addopts = "-ra"

[tool.coverage.run]
source = ["dumpex"]
branch = true

[tool.coverage.report]
# Gate CI on total coverage, not just report it — a few points below the
# measured baseline (branch coverage, full extras installed) at the time
# this was added, so ordinary test additions don't trip it while a real
# regression (removing tests, adding a large untested module) does. Raise
# this incrementally as coverage improves; never lower it to make a
# failing PR pass — fix the coverage gap instead.
fail_under = 45
show_missing = true
