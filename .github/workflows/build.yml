name: Build Release EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (format: vX.Y.Z)'
        required: true
      prerelease:
        description: 'Mark as pre-release?'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate release request
        id: release_version
        # The workflow_dispatch input becomes the build-time package version.
        # Validate it before passing it to setuptools-scm and creating a tag.
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:GITHUB_REF_NAME -ne $env:DEFAULT_BRANCH) {
            throw "Releases must be dispatched from '$env:DEFAULT_BRANCH' (got '$env:GITHUB_REF_NAME')"
          }
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release version input must look like 'vX.Y.Z' (got '$env:RELEASE_TAG')"
          }
          $expected = $Matches[1]

          $existingTag = git tag --list $env:RELEASE_TAG
          if ($existingTag) {
            $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Existing tag $env:RELEASE_TAG points to $tagCommit, not workflow commit $env:GITHUB_SHA"
            }
          }

          "version=$expected" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DUMPEX=$expected" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Version check passed: $expected"

      - name: Install dependencies
        run: python -m pip install "pyinstaller==6.21.0" -e ".[full,dev]"

      - name: Verify resolved package version
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          $resolvedVersion = python -c "import dumpex; print(dumpex.__version__)"
          if ($resolvedVersion -ne $env:EXPECTED_VERSION) {
            throw "Resolved package version ($resolvedVersion) does not match release input ($env:EXPECTED_VERSION)"
          }
          Write-Host "Resolved package version: $resolvedVersion"

      - name: Run tests before packaging
        run: pytest

      - name: Build EXE
        # Keep the resources inside their real Python package. Both the
        # installed wheel and the frozen executable then resolve the same
        # canonical dumpex/rules_pkg/data layout via importlib.resources.
        # The CLI deliberately uses Unicode evidence/output labels, so force
        # UTF-8 mode for redirected/non-console Windows executions as well.
        run: pyinstaller --onefile dumpex.py --name dumpex --collect-data dumpex.rules_pkg --python-option "X utf8"

      - name: Verify bundled package resources
        shell: pwsh
        run: |
          $archive = (& pyi-archive_viewer -l dist/dumpex.exe) -join "`n"
          $archive = $archive.Replace('\', '/')
          $archive = $archive -replace '/+', '/'
          $required = @(
            'dumpex/rules_pkg/data/rules.yaml',
            'dumpex/rules_pkg/data/yara/cs_indicators.yar',
            'dumpex/rules_pkg/data/yara/lateral_movement.yar',
            'dumpex/rules_pkg/data/yara/suspicious_memory.yar'
          )
          foreach ($resource in $required) {
            if (-not $archive.Contains($resource)) {
              throw "PyInstaller artifact is missing package resource: $resource"
            }
          }
          & .\dist\dumpex.exe --help

      - name: Stage the output-contract schemas as release assets
        # dumpex.exe never reads these files at runtime (only the test suite
        # and external --json consumers validate against them), so they
        # aren't collected into the frozen EXE via --collect-data -- there is
        # nothing for PyInstaller to bundle them FOR. They're shipped instead
        # as plain, separately downloadable files alongside dumpex.exe, so an
        # EXE-only user (no `pip install dumpex`, no source checkout) can
        # still get the current schema for this release without needing the
        # wheel. Every dumpex-output-v*.schema.json is staged (the current
        # contract every command -- including --hunt -- now produces is
        # named by dumpex.schemas.CURRENT_SCHEMA, v2.13 as of this writing,
        # plus every frozen historical version kept for validating output
        # produced before each respective schema_version
        # bump -- see docs/OUTPUT_SCHEMA.md), matching what the wheel already
        # packages (see scripts/package_smoke.py's own schema-presence
        # check), rather than a hardcoded single-file list that would need
        # editing every time a new schema version ships. Each file is
        # validated as JSON here so a corrupted/empty file never ships
        # silently.
        shell: pwsh
        run: |
          $schemas = Get-ChildItem dumpex/schemas -Filter 'dumpex-output-v*.schema.json'
          if ($schemas.Count -eq 0) {
            throw "No dumpex-output-v*.schema.json files found under dumpex/schemas"
          }
          foreach ($schema in $schemas) {
            python -c "import json; json.load(open(r'$($schema.FullName)', encoding='utf-8'))"
            Copy-Item $schema.FullName "dist/$($schema.Name)"
          }
          Write-Host "Staged schemas: $($schemas.Name -join ', ')"

      - name: Stage license, source, and dependency notices
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/LICENSE
          Copy-Item NOTICE dist/NOTICE
          Copy-Item THIRD_PARTY_NOTICES dist/THIRD_PARTY_NOTICES
          Copy-Item CREDITS dist/CREDITS
          python scripts/collect_dependency_licenses.py `
            dist/third-party-licenses `
            --include-distribution PyInstaller `
            --include-python-license
          python -m pip list --format=freeze |
            Set-Content -LiteralPath dist/BUILD-DEPENDENCIES.txt -Encoding utf8

      - name: Create complete versioned Windows bundle
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
          RELEASE_TAG: ${{ github.event.inputs.version }}
          REPOSITORY: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          $bundleName = "dumpex-v$env:RELEASE_VERSION-windows-x64"
          $bundleDir = "dist/$bundleName"

          New-Item -ItemType Directory -Path $bundleDir | Out-Null
          Copy-Item dist/dumpex.exe $bundleDir/dumpex.exe
          Copy-Item dist/dumpex-output-v*.schema.json $bundleDir/
          Copy-Item dist/LICENSE $bundleDir/LICENSE
          Copy-Item dist/NOTICE $bundleDir/NOTICE
          Copy-Item dist/THIRD_PARTY_NOTICES $bundleDir/THIRD_PARTY_NOTICES
          Copy-Item dist/CREDITS $bundleDir/CREDITS
          Copy-Item dist/BUILD-DEPENDENCIES.txt $bundleDir/BUILD-DEPENDENCIES.txt
          Copy-Item `
            -LiteralPath dist/third-party-licenses `
            -Destination $bundleDir/third-party-licenses `
            -Recurse

          @(
            "dumpex v$env:RELEASE_VERSION source code"
            "==========================="
            ""
            "Release tag:"
            "https://github.com/$env:REPOSITORY/tree/$env:RELEASE_TAG"
            ""
            "Exact build commit:"
            "https://github.com/$env:REPOSITORY/commit/$env:BUILD_SHA"
            ""
            "The MPL-2.0-covered Source Code Form is available from the release tag above."
          ) | Set-Content -LiteralPath dist/SOURCE.txt -Encoding utf8
          Copy-Item dist/SOURCE.txt $bundleDir/SOURCE.txt

          Compress-Archive `
            -Path "$bundleDir/*" `
            -DestinationPath "dist/$bundleName.zip"

      - name: Verify release bundle contents
        # Guards against exactly the gap this release process shipped once
        # before: dumpex.exe, LICENSE/NOTICE/etc, and only the *v1.1* schema
        # made it into the zip while the CLI itself had already moved every
        # command (including --hunt) onto a newer schema -- an EXE-only user
        # had no way to get the schema that actually described their own
        # --json output. The required current-schema filename is read from
        # dumpex.schemas.CURRENT_SCHEMA itself, not hardcoded here, so this
        # check can't silently go stale the next time schema_version bumps
        # (it did once already, when this literal named v2.6 long after the
        # contract had moved on).
        # Checked against the built zip itself (not just $bundleDir) so a
        # Compress-Archive mistake (wrong -Path, wrong destination) would
        # also be caught here, not just a missing Copy-Item.
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          $bundleName = "dumpex-v$env:RELEASE_VERSION-windows-x64"
          $zipPath = "dist/$bundleName.zip"
          $extractDir = "dist/verify-$bundleName"
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractDir

          $currentSchema = python -c "from dumpex.schemas import CURRENT_SCHEMA; print(CURRENT_SCHEMA)"
          $required = @(
            'dumpex.exe',
            $currentSchema,
            'LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES', 'CREDITS',
            'BUILD-DEPENDENCIES.txt', 'SOURCE.txt'
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $extractDir $_)) }
          if ($missing) {
            throw "Release bundle is missing required file(s): $($missing -join ', ')"
          }

          # Every dumpex-output-v*.schema.json staged into dist/ earlier must
          # have made it into the bundle too -- not just the current schema
          # ($currentSchema, dumpex.schemas.CURRENT_SCHEMA) checked above.
          $stagedSchemas = (Get-ChildItem dist -Filter 'dumpex-output-v*.schema.json').Name
          $bundledSchemas = (Get-ChildItem $extractDir -Filter 'dumpex-output-v*.schema.json').Name
          $missingSchemas = $stagedSchemas | Where-Object { $_ -notin $bundledSchemas }
          if ($missingSchemas) {
            throw "Release bundle is missing schema file(s): $($missingSchemas -join ', ')"
          }

          # Every schema file inside the zip must still be valid, parseable
          # JSON (catches a truncated/corrupted Compress-Archive as well as
          # a corrupted source file).
          foreach ($schema in $bundledSchemas) {
            python -c "import json; json.load(open(r'$(Join-Path $extractDir $schema)', encoding='utf-8'))"
          }

          Write-Host "Bundle contents verified: $($required -join ', '), $($bundledSchemas -join ', ')"
          Remove-Item -Recurse -Force $extractDir

      - name: Generate SHA-256 checksums
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          $bundle = "dist/dumpex-v$env:RELEASE_VERSION-windows-x64.zip"
          $hash = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $bundle)" |
            Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8

      - name: Attest the complete Windows bundle
        uses: actions/attest@v4
        with:
          subject-path: dist/dumpex-v${{ steps.release_version.outputs.version }}-windows-x64.zip

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Dumpex ${{ github.event.inputs.version }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Windows users should download
            `dumpex-v${{ steps.release_version.outputs.version }}-windows-x64.zip`.
            It contains the executable, MPL-2.0/source notice, output schemas,
            and all collected third-party license files.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.event.inputs.version }}/CHANGELOG.md)
            for user-facing changes in this release, including output-contract migrations.

            Exact source: https://github.com/${{ github.repository }}/tree/${{ github.event.inputs.version }}
          files: |
            dist/dumpex-v${{ steps.release_version.outputs.version }}-windows-x64.zip
            dist/SHA256SUMS.txt
