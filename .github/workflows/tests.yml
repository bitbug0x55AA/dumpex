  minidump-version-range:
    # Verify every listed minidump version installs and supports the
    # HandleDataStream descriptor layout exercised on first use.
    #
    # Keep this hand-written matrix aligned with pyproject.toml through
    # tests/unit/test_minidump_version_pin.py. When widening the range, add
    # real in-range releases and revalidate the descriptor layout.
    needs: plan
    # Auxiliary gates run only in the full tier.
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minidump-version: ["0.0.24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dumpex with dev extras
        run: pip install -e ".[dev]"

      - name: Pin minidump to ${{ matrix.minidump-version }}
        run: pip install "minidump==${{ matrix.minidump-version }}"

      - name: Verify the pinned version actually installed
        # `pip install` can exit 0 while printing a dependency-conflict
        # warning rather than actually installing the requested pin --
        # check installed metadata directly instead of trusting the exit
        # code alone.
        run: |
          python -c "
          import importlib.metadata as m
          installed = m.version('minidump')
          expected = '${{ matrix.minidump-version }}'
          assert installed == expected, f'expected minidump=={expected}, got {installed}'
          "

      - name: Import dumpex.core.memory (module-level import path)
        run: python -c "import dumpex.core.memory"

      - name: Handle-stream descriptor layout + parsing suite (exercises _handle_descriptor_layout())
        run: pytest tests/unit/test_handle_stream_parse.py -v

  minidump-version-pin-consistency:
    # Report CI-matrix/package-specifier drift as a dedicated gate.
    needs: plan
    # Auxiliary gates run only in the full tier.
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev extras (packaging, pyyaml, pytest)
        run: pip install -e ".[dev]"

      - name: minidump version pin <-> CI matrix consistency
        run: pytest tests/unit/test_minidump_version_pin.py -v

  package-smoke:
    # Editable installs do not prove package-data inclusion. Build and install
    # the real wheel/sdist, then load rules and schemas via importlib.resources.
    needs: plan
    # Auxiliary gates run only in the full tier.
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build

      - name: Copy smoke script outside the checkout
        # The smoke test MUST run from a directory that does not contain a
        # `dumpex/` source folder: Python adds the invoked script's own
        # directory to sys.path ahead of site-packages, so running this
        # script from inside the checkout would silently import the
        # repo's source tree instead of the installed wheel/sdist even if
        # the install itself were broken -- defeating the entire point of
        # this job. See scripts/package_smoke.py's own docstring.
        run: cp scripts/package_smoke.py "$RUNNER_TEMP/package_smoke.py"

      - name: Wheel — install into a fresh venv and run the smoke test
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv "$RUNNER_TEMP/venv-wheel"
          "$RUNNER_TEMP/venv-wheel/bin/pip" install --quiet "$GITHUB_WORKSPACE"/dist/*.whl
          "$RUNNER_TEMP/venv-wheel/bin/python" "$RUNNER_TEMP/package_smoke.py" "$GITHUB_WORKSPACE"

      - name: Sdist — install into a fresh venv and run the smoke test
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv "$RUNNER_TEMP/venv-sdist"
          "$RUNNER_TEMP/venv-sdist/bin/pip" install --quiet "$GITHUB_WORKSPACE"/dist/*.tar.gz
          "$RUNNER_TEMP/venv-sdist/bin/python" "$RUNNER_TEMP/package_smoke.py" "$GITHUB_WORKSPACE"
