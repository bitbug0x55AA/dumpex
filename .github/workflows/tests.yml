name: Tests

# One PR used to cost three identical full runs: the branch push, the
# pull_request event fired seconds later on the same tree, and the push to
# main after the merge. The `plan` job below collapses that -- see its own
# comment for the tiering rules.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first: nothing is learned from finishing a
# run against a tree that is already stale. main is exempt -- every commit
# that lands there gets its own complete, uncancelled verification.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    # Decides how much of this workflow actually needs to run, so the same
    # tree is never fully tested twice:
    #
    #   skip  push to a branch that already has an open PR. The
    #         pull_request event fires on the same commit (they landed 33s
    #         apart before this job existed) and tests refs/pull/N/merge,
    #         which is strictly more relevant. The push run added nothing.
    #   fast  push to a branch with no open PR -- pre-PR work in progress.
    #         One leg (ubuntu + 3.12), no coverage, no auxiliary jobs:
    #         ~1 minute for "did I break something obvious".
    #   full  every pull_request, every push to main, every manual
    #         dispatch. The complete 2x2 matrix plus the packaging,
    #         minidump-pin and pin-consistency jobs.
    #
    # This job is deliberately checkout-free; it is metadata only.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
      os: ${{ steps.pick.outputs.os }}
      python: ${{ steps.pick.outputs.python }}
    steps:
      - name: Pick test tier for this event
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          # Never interpolate a ref straight into a shell script: a branch
          # name is attacker-controllable on a public repo and would be
          # evaluated by bash. Pass it as an environment value instead.
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          mode=full
          if [[ "$EVENT_NAME" == "push" && "$REF" != "refs/heads/main" ]]; then
            # `gh api` fails open here: if the lookup errors we assume no
            # PR and run the fast lane, which is the safe direction (extra
            # signal, never missing signal).
            open_prs="$(gh api \
              --method GET \
              "repos/$REPO/pulls" \
              -f state=open \
              -f "head=$OWNER:$REF_NAME" \
              --jq 'length' 2>/dev/null || echo 0)"

            if [[ "$open_prs" -gt 0 ]]; then
              mode=skip
            else
              mode=fast
            fi
          fi

          case "$mode" in
            full) os='["ubuntu-latest", "windows-latest"]'; python='["3.10", "3.12"]' ;;
            *)    os='["ubuntu-latest"]';                   python='["3.12"]' ;;
          esac

          {
            echo "mode=$mode"
            echo "os=$os"
            echo "python=$python"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Test tier: \`$mode\`"
            echo
            case "$mode" in
              skip) echo "Branch \`$REF_NAME\` has an open pull request; its \`pull_request\` run tests the same commit merged into \`main\`. Nothing to do here." ;;
              fast) echo "Pre-PR push: ubuntu-latest / Python 3.12 only, no coverage gates. Open a pull request for the full matrix." ;;
              full) echo "Full matrix: ubuntu-latest + windows-latest, Python 3.10 + 3.12, coverage gates, packaging and minidump-pin jobs." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  pytest:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # requires-python in pyproject.toml is the floor; one current
        # version stands in for "a main supported runtime". No real
        # .dmp/PE sample files are needed — the suite builds its own
        # synthetic fixtures (see tests/fixtures/fakes.py).
        python-version: ${{ fromJSON(needs.plan.outputs.python) }}
        # dumpex parses Windows minidumps and reasons about Windows-
        # specific memory/protection semantics (MEM_IMAGE/MEM_PRIVATE,
        # PAGE_EXECUTE_WRITECOPY, backslash paths in module/PEB records,
        # ...) -- Ubuntu-only CI had never actually run this suite on the
        # platform it targets. Path handling, file-locking/O_EXCL
        # semantics (safe_io), and temp-directory behavior can all differ
        # in ways Linux CI can't catch.
        os: ${{ fromJSON(needs.plan.outputs.os) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Cache the pip *download* cache, keyed on pyproject.toml. The
          # install itself still runs (an editable install must), but the
          # wheels no longer come off the network on every leg -- which is
          # where a large share of the Windows legs' wall time went.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dumpex with dev + optional extras
        run: pip install -e ".[dev,full]"

      - name: Hunt CLI golden fixtures up to date (scripts/update_hunt_cli_goldens.py --check)
        # Runs on both OSes in the matrix -- a console-rendering change
        # made on one platform must produce byte-identical goldens on the
        # other (no OS-specific line-ending/path drift), and this is the
        # cheapest place to catch a forgotten `python scripts/
        # update_hunt_cli_goldens.py` before the parametrized tests in
        # tests/integration/test_hunt_cli_compat_freeze.py fail one
        # scenario at a time with less context.
        run: python scripts/update_hunt_cli_goldens.py --check

      - name: Untrusted console text — ratchet (new unescaped output fails; existing debt warns)
        # Everything dumpex prints that came out of a dump is attacker-
        # controlled: a newline in a module name or a handle's ObjectName
        # forges a "[~]" coverage-reason line, ESC drives the terminal, and
        # U+202E visually reorders the evidence. Each case builds real
        # records, calls the real renderer, and inspects the bytes that
        # actually reached stdout — it does NOT scan source for `print(`/
        # `console_safe` spellings, which an earlier revision did and which
        # missed nine of eleven ways to write the same bug (most importantly
        # `console_safe()` applied to the wrong value in the same call).
        # Runs as its own named step for the same reason the
        # minidump-version-pin job below does — the warning list naming
        # every still-leaking renderer has to be readable, not buried in a
        # 1700-test run. FAILS on a renderer that leaks and is not already
        # listed, and on a listed renderer that has since been fixed
        # (delete its entry); the known ones warn.
        run: pytest tests/unit/test_console_untrusted_text.py -v -W "always::UserWarning"

      - name: Run pytest (coverage measured on the ubuntu / 3.12 leg only)
        # The coverage gates below are platform- and version-independent by
        # construction -- the same thresholds were already applied to all
        # four legs, because "the modules under test don't branch on
        # platform". Measuring the identical numbers four times bought
        # nothing, so exactly one leg carries --cov and the other legs run
        # the suite plain. Coverage still gates every pull request and
        # every commit on main; it is skipped on the pre-PR fast lane.
        shell: bash
        env:
          COVERAGE_LEG: ${{ needs.plan.outputs.mode == 'full' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        run: |
          set -euo pipefail
          if [[ "$COVERAGE_LEG" == "true" ]]; then
            pytest --cov=dumpex --cov-report=term-missing
          else
            pytest
          fi

      - name: Coverage gate — key detection modules
        # Use the same fail-fast native-command semantics on every runner.
        # PowerShell can otherwise continue after a failing coverage command
        # and report the final command's success, producing a false green job.
        shell: bash
        # Runs even if the overall gate above already failed, so both
        # classes of regression show up in the same CI run instead of
        # needing a second push to discover the per-module one. Targets
        # sit a few points below each module's measured coverage when
        # this was added — raise them as coverage improves, don't lower
        # them to make a failing PR pass. Same thresholds on every OS in
        # the matrix: the modules under test don't branch on platform, so
        # coverage shouldn't either -- which is exactly why only the
        # ubuntu/3.12 leg measures it. `always()` keeps this step running
        # when the suite above failed, so both classes of regression
        # surface in one run; the leg check keeps it off the legs that
        # produced no .coverage file to report on.
        if: always() && needs.plan.outputs.mode == 'full' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          coverage report --include="dumpex/core/pe_utils.py"   --fail-under=56
          coverage report --include="dumpex/hunt/_coverage.py"  --fail-under=85
          coverage report --include="dumpex/hunt/_finding.py"   --fail-under=90
          # dumpex/hunt/_domain.py: the canonical hunter-neutral CheckResult
          # and the recursive-immutability guard every migrated Report is
          # validated through. New in this change and pure validation logic
          # with no console/presentation branches, so the gate sits close to
          # its measured coverage from day one.
          coverage report --include="dumpex/hunt/_domain.py"     --fail-under=95
          # dumpex/hunt/hollowing/*: same reasoning as the packages below
          # -- hollowing.py is a package now, not a single file. The
          # canonical report cutover (issue #10) split the old single-file
          # module into an immutable domain model, a scan/enrichment layer
          # that resolves the image base once, the one statement of the
          # correlation requirement, and four independent projectors. Every
          # new boundary is gated so a stale path fails visibly and no
          # output projection is left without coverage.
          coverage report --include="dumpex/hunt/hollowing/__init__.py"       --fail-under=95
          coverage report --include="dumpex/hunt/hollowing/config.py"        --fail-under=95
          # models.py is this hunter's whole immutable Evidence vocabulary
          # (identity snapshots + per-field validation), directly exercised
          # by tests/hunt/test_hollowing_domain.py.
          coverage report --include="dumpex/hunt/hollowing/models.py"        --fail-under=95
          # memory_scan.py is the only layer that still touches `mf`/a raw
          # region/module/PEB. Slightly lower than its neighbours: the
          # header-read classification has one branch per outcome and the
          # region walk one per miss, all covered, but this is the file most
          # likely to grow a rarely-hit dump-shape branch.
          coverage report --include="dumpex/hunt/hollowing/memory_scan.py"   --fail-under=90
          coverage report --include="dumpex/hunt/hollowing/correlation.py"   --fail-under=95
          coverage report --include="dumpex/hunt/hollowing/aggregate.py"     --fail-under=95
          coverage report --include="dumpex/hunt/hollowing/domain.py"        --fail-under=95
          coverage report --include="dumpex/hunt/hollowing/report_console.py" --fail-under=95
          coverage report --include="dumpex/hunt/hollowing/report_facts.py"   --fail-under=90
          coverage report --include="dumpex/hunt/hollowing/report_legacy.py"  --fail-under=95
          coverage report --include="dumpex/hunt/hollowing/report_record.py"  --fail-under=95
          # dumpex/hunt/encoding/*: encoding.py is a package now, not a
          # single file -- _hunt_encoding (the thin entry point) lives in
          # __init__.py; each scan layer, the aggregation logic, and the
          # console renderer are gated separately so no single file's
          # (deliberately) high coverage can mask another one's gap.
          coverage report --include="dumpex/hunt/encoding/__init__.py"       --fail-under=95
          coverage report --include="dumpex/hunt/encoding/config.py"        --fail-under=95
          coverage report --include="dumpex/hunt/encoding/models.py"        --fail-under=90
          coverage report --include="dumpex/hunt/encoding/classification.py" --fail-under=90
          coverage report --include="dumpex/hunt/encoding/entropy.py"       --fail-under=75
          coverage report --include="dumpex/hunt/encoding/sleep_mask.py"    --fail-under=85
          coverage report --include="dumpex/hunt/encoding/decoding.py"      --fail-under=78
          coverage report --include="dumpex/hunt/encoding/aggregate.py"     --fail-under=90
          # The canonical report cutover split the old presentation.py into
          # the immutable domain model and independent console/facts/legacy/
          # record projectors. Gate every new boundary so stale paths fail
          # visibly and no output projection is left without coverage.
          coverage report --include="dumpex/hunt/encoding/domain.py"         --fail-under=95
          coverage report --include="dumpex/hunt/encoding/report_console.py" --fail-under=90
          coverage report --include="dumpex/hunt/encoding/report_facts.py"   --fail-under=90
          coverage report --include="dumpex/hunt/encoding/report_legacy.py"  --fail-under=90
          coverage report --include="dumpex/hunt/encoding/report_record.py"  --fail-under=95
          # dumpex/hunt/cs_beacon/*: same reasoning as encoding/* above --
          # cs_beacon.py is a package now, not a single file. parser.py has
          # low coverage because most Malleable C2/SSH/DNS transport display
          # branches and the --verbose full field table only run against a
          # fully-populated real config, which the unit fixtures deliberately
          # keep minimal.
          coverage report --include="dumpex/hunt/cs_beacon/__init__.py"     --fail-under=95
          coverage report --include="dumpex/hunt/cs_beacon/config.py"      --fail-under=95
          coverage report --include="dumpex/hunt/cs_beacon/schema.py"      --fail-under=95
          # models.py stopped being a handful of mutable DTOs and became
          # this hunter's whole immutable Evidence vocabulary (identity
          # snapshots + per-field validation), so its gate moves up with
          # its new role rather than staying at the old DTO threshold.
          coverage report --include="dumpex/hunt/cs_beacon/models.py"      --fail-under=95
          coverage report --include="dumpex/hunt/cs_beacon/der.py"         --fail-under=85
          coverage report --include="dumpex/hunt/cs_beacon/context.py"     --fail-under=85
          coverage report --include="dumpex/hunt/cs_beacon/scanner.py"     --fail-under=80
          coverage report --include="dumpex/hunt/cs_beacon/aggregate.py"   --fail-under=90
          coverage report --include="dumpex/hunt/cs_beacon/parser.py"      --fail-under=30
          # The canonical report cutover split the old presentation.py into
          # the immutable domain model and independent console/facts/legacy/
          # record projectors. Gate every new boundary so a stale path fails
          # visibly and no output projection is left without coverage.
          # domain.py/report_console.py sit a few points below their sibling
          # hunters' usual 95 -- most Malleable C2/SSH/DNS transport display
          # branches and the --verbose full field table only run against a
          # fully-populated real config, same reasoning as parser.py above.
          coverage report --include="dumpex/hunt/cs_beacon/domain.py"         --fail-under=85
          coverage report --include="dumpex/hunt/cs_beacon/report_console.py" --fail-under=80
          coverage report --include="dumpex/hunt/cs_beacon/report_facts.py"   --fail-under=90
          coverage report --include="dumpex/hunt/cs_beacon/report_legacy.py"  --fail-under=95
          coverage report --include="dumpex/hunt/cs_beacon/report_record.py"  --fail-under=95
          coverage report --include="dumpex/hunt/cs_beacon/collect.py"        --fail-under=95
          # dumpex/hunt/injection/*: same reasoning -- injection.py is a
          # package now, not a single file.
          coverage report --include="dumpex/hunt/injection/__init__.py"     --fail-under=95
          coverage report --include="dumpex/hunt/injection/config.py"      --fail-under=95
          coverage report --include="dumpex/hunt/injection/models.py"      --fail-under=95
          # domain.py is the canonical immutable InjectionReport/
          # CoverageSnapshot/InjectionEvidence model the hunter is being
          # migrated onto -- same reasoning as _domain.py above.
          coverage report --include="dumpex/hunt/injection/domain.py"      --fail-under=95
          coverage report --include="dumpex/hunt/injection/correlation.py" --fail-under=80
          coverage report --include="dumpex/hunt/injection/memory_scan.py" --fail-under=80
          coverage report --include="dumpex/hunt/injection/aggregate.py"   --fail-under=80
          coverage report --include="dumpex/hunt/injection/thread_scan.py" --fail-under=70
          # The canonical report cutover split the old presentation.py into
          # independent console/facts/legacy/record projectors. Gate each
          # projection so a stale pre-cutover path cannot make coverage abort
          # with "No data to report", and no new projection is left unguarded.
          coverage report --include="dumpex/hunt/injection/report_console.py" --fail-under=95
          coverage report --include="dumpex/hunt/injection/report_facts.py"   --fail-under=90
          coverage report --include="dumpex/hunt/injection/report_legacy.py"  --fail-under=95
          coverage report --include="dumpex/hunt/injection/report_record.py"  --fail-under=95
          # dumpex/hunt/stomping/*: same reasoning -- stomping.py is a
          # package now, not a single file.
          coverage report --include="dumpex/hunt/stomping/__init__.py"        --fail-under=85
          coverage report --include="dumpex/hunt/stomping/config.py"         --fail-under=95
          coverage report --include="dumpex/hunt/stomping/correlation.py"    --fail-under=85
          coverage report --include="dumpex/hunt/stomping/disk_reference.py" --fail-under=70
          coverage report --include="dumpex/hunt/stomping/memory_scan.py"    --fail-under=85
          # models.py stopped being a handful of mutable DTOs and became
          # this hunter's whole immutable Evidence vocabulary (identity
          # snapshots + per-field validation), so its gate moves up with
          # its new role rather than staying at the old DTO threshold.
          coverage report --include="dumpex/hunt/stomping/models.py"         --fail-under=95
          # The canonical report cutover moved every Finding/facts/coverage
          # decision out of the old mutable Report and the old
          # presentation.py into the immutable domain model plus four
          # independent projectors. aggregate.py is now pure evidence ->
          # CheckResult reduction, hence the much higher gate. Every new
          # boundary is gated so a stale path fails visibly and no output
          # projection is left without coverage.
          coverage report --include="dumpex/hunt/stomping/aggregate.py"       --fail-under=95
          coverage report --include="dumpex/hunt/stomping/domain.py"          --fail-under=95
          coverage report --include="dumpex/hunt/stomping/report_console.py"  --fail-under=95
          coverage report --include="dumpex/hunt/stomping/report_facts.py"    --fail-under=90
          coverage report --include="dumpex/hunt/stomping/report_legacy.py"   --fail-under=95
          coverage report --include="dumpex/hunt/stomping/report_record.py"   --fail-under=95
          # dumpex/hunt/pipe/*: same reasoning -- pipe.py is a package now,
          # not a single file.
          coverage report --include="dumpex/hunt/pipe/__init__.py"      --fail-under=95
          coverage report --include="dumpex/hunt/pipe/config.py"       --fail-under=95
          coverage report --include="dumpex/hunt/pipe/patterns.py"    --fail-under=75
          coverage report --include="dumpex/hunt/pipe/handle_scan.py" --fail-under=70
          # memory_scan.py's gate moves up (from 58) with the canonical
          # report cutover: it now builds typed PipeStringEvidence/
          # C2ContextRecord/PipeScanCoverage rather than hand-rolled dicts,
          # and tests/hunt/test_pipe_domain.py exercises those construction
          # paths directly.
          coverage report --include="dumpex/hunt/pipe/memory_scan.py" --fail-under=65
          # models.py stopped being three mutable DTOs and became this
          # hunter's whole immutable Evidence vocabulary (identity
          # snapshots + per-field validation), so its gate moves up with
          # its new role rather than staying at the old DTO threshold.
          coverage report --include="dumpex/hunt/pipe/models.py"       --fail-under=95
          # The canonical report cutover moved every Finding/facts/coverage
          # decision out of the old mutable Report and the old
          # presentation.py into the immutable domain model plus four
          # independent projectors. aggregate.py is now pure evidence ->
          # CheckResult reduction, hence the much higher gate (was 78).
          # correlation.py now produces typed evidence instead of tuples,
          # also directly tested, so its gate rises from 78 too. Every new
          # boundary is gated so a stale path fails visibly and no output
          # projection is left without coverage.
          coverage report --include="dumpex/hunt/pipe/correlation.py"  --fail-under=85
          coverage report --include="dumpex/hunt/pipe/aggregate.py"    --fail-under=95
          coverage report --include="dumpex/hunt/pipe/domain.py"         --fail-under=95
          coverage report --include="dumpex/hunt/pipe/report_console.py" --fail-under=95
          coverage report --include="dumpex/hunt/pipe/report_facts.py"   --fail-under=90
          coverage report --include="dumpex/hunt/pipe/report_legacy.py"  --fail-under=95
          coverage report --include="dumpex/hunt/pipe/report_record.py"  --fail-under=95
          # dumpex/hunt/yara_hunt/*: same reasoning -- yara_hunt.py is a
          # package now, not a single file. context.py's PE_In_Private_Memory
          # classification policy has dedicated coverage
          # (tests/hunt/test_yara_context.py) after a P2 review found it
          # essentially untested despite deciding DETECTED vs. INCONCLUSIVE
          # vs. clean. The canonical report cutover (issue #11) replaced the
          # mutable RuleBundle/ScanOutcome/RuleGroup DTOs and presentation.py
          # with the immutable YaraReport domain model plus independent
          # console/facts/legacy/record projectors (dumpex/hunt/test_yara_
          # domain.py exercises the domain model directly, mirroring
          # test_cs_beacon_domain.py) -- presentation.py's own gate is gone
          # with the file; every new boundary is gated so a stale path fails
          # visibly and no output projection is left without coverage.
          # models.py stopped being a handful of mutable DTOs and became this
          # hunter's whole immutable Evidence vocabulary (identity snapshots
          # + per-field validation, incl. an arbitrary-meta-block tuple) --
          # its gate stays at 95 (its pre-migration threshold too;
          # tests/hunt/test_yara_domain.py directly exercises the validator
          # branches this new role added, same as every sibling hunter's own
          # models.py gate).
          coverage report --include="dumpex/hunt/yara_hunt/__init__.py"       --fail-under=90
          coverage report --include="dumpex/hunt/yara_hunt/config.py"        --fail-under=95
          coverage report --include="dumpex/hunt/yara_hunt/models.py"        --fail-under=95
          coverage report --include="dumpex/hunt/yara_hunt/aggregate.py"     --fail-under=95
          coverage report --include="dumpex/hunt/yara_hunt/scanner.py"       --fail-under=85
          coverage report --include="dumpex/hunt/yara_hunt/rules.py"         --fail-under=80
          coverage report --include="dumpex/hunt/yara_hunt/context.py"       --fail-under=90
          coverage report --include="dumpex/hunt/yara_hunt/domain.py"         --fail-under=85
          coverage report --include="dumpex/hunt/yara_hunt/report_console.py" --fail-under=88
          coverage report --include="dumpex/hunt/yara_hunt/report_facts.py"   --fail-under=90
          coverage report --include="dumpex/hunt/yara_hunt/report_legacy.py"  --fail-under=95
          coverage report --include="dumpex/hunt/yara_hunt/report_record.py"  --fail-under=95
          coverage report --include="dumpex/hunt/yara_hunt/collect.py"        --fail-under=95
          coverage report --include="dumpex/hunt/_context.py"               --fail-under=90
          # dumpex/output/*: the v2 structured-output contract (--list/
          # --modules/--threads/--process/--sysinfo/--handles/--profile).
          # New in this change, so gates sit close to measured coverage
          # from day one rather than starting loose -- records.py/
          # serializer.py are pure data transforms with no console/
          # presentation branches to skip testing.
          coverage report --include="dumpex/output/records.py"       --fail-under=95
          coverage report --include="dumpex/output/serializer.py"    --fail-under=95
          coverage report --include="dumpex/output/envelope.py"      --fail-under=85
          coverage report --include="dumpex/output/collector.py"     --fail-under=80
          # dumpex/output/coverage.py + command_result.py: the first-class
          # coverage/provenance core (SourceObservation, CoverageLimitation,
          # CoverageReport, CommandResult, exit_code_for), validated so far
          # by migrating --list/--modules onto it; table-driven tests cover
          # every source state and both limitation-rendering paths, hence
          # the tight gates.
          coverage report --include="dumpex/output/coverage.py"       --fail-under=95
          coverage report --include="dumpex/output/command_result.py" --fail-under=95
          # dumpex/commands/{list_cmd,modules,threads,sysinfo}.py: four of
          # the seven recon commands' collect_*()/render_*_console() split.
          # collect_*() (the part that matters for --json output) is
          # thoroughly covered; render_*_console()'s console-formatting
          # branches are not chased for coverage the same way presentation
          # modules elsewhere in this file aren't. --pid/--peb (and
          # dumpex/commands/peb.py) were retired in issue #43's atomic
          # v2.13 cutover, replaced by --process/--handles below and
          # --profile (already gated further down) -- there is no
          # command-only module left for either retired flag to gate.
          coverage report --include="dumpex/commands/list_cmd.py" --fail-under=90
          coverage report --include="dumpex/commands/modules.py"  --fail-under=80
          coverage report --include="dumpex/commands/threads.py"  --fail-under=65
          coverage report --include="dumpex/commands/sysinfo.py"  --fail-under=70
          # dumpex/commands/process.py + handles.py: --process (issue #40)
          # and --handles (issue #42), the two other commands #43 exposed
          # through the CLI in the same cutover as --profile below. Gated
          # from day one for the same "evidence-boundary claim" reason
          # --profile is: collect_process()/collect_handles() are the part
          # that matters for --json output and are thoroughly covered
          # (measured ~98%/100%); render_*_console()'s own formatting
          # branches are not chased for coverage, same as every other
          # recon command's console renderer above.
          coverage report --include="dumpex/commands/process.py" --fail-under=90
          coverage report --include="dumpex/commands/handles.py" --fail-under=90
          # dumpex/commands/profile.py: --profile's own collect/render/
          # command slice (issue #95, docs/recon_profile_contract.md).
          # Gated from day one like the block above, and for the same
          # reason the record types it builds are: --profile's whole
          # output is an evidence-boundary claim ("this capability can be
          # analysed from this dump, that one cannot"), so an untested
          # path here does not merely skip a display branch -- it can
          # publish a capability status no evidence supports. Sits a few
          # points below its measured coverage when this was added: what
          # is uncovered is the defensive fallback arm of the stream
          # record-count helper (an mf attribute that is neither a sized
          # collection nor a singular object) plus two collector early
          # returns, none of which the FakeMF-driven suite in
          # tests/unit/test_profile_cmd.py can reach without faking a
          # dump shape open_dump() never produces.
          coverage report --include="dumpex/commands/profile.py"  --fail-under=90

  minidump-version-range:
    # Proves the range pinned in pyproject.toml's `minidump>=X,<Y` (issue
    # #86) actually works, not just that the metadata declares it: pins
    # minidump to each version in the matrix below (`pip install
    # "minidump==<version>"` after the normal editable install, so the
    # exact pin wins over whatever the resolver would otherwise pick),
    # verifies that exact version actually landed (not just that `pip
    # install` exited 0 -- a version conflict warning does not fail the
    # command), imports dumpex.core.memory, and runs the handle-stream
    # suite -- which is what actually exercises the HandleDataStream
    # descriptor layout check (dumpex/core/memory.py's
    # _handle_descriptor_layout()); that check runs lazily on first use,
    # not merely from `import dumpex.core.memory`.
    #
    # The `minidump-version` list below is NOT derived from
    # pyproject.toml -- it is a separate, hand-written literal, checked
    # against it by tests/unit/test_minidump_version_pin.py, which fails
    # at PR time if EITHER (a) the specifier's own floor is missing from
    # this list, or (b) any version in this list falls outside the
    # specifier's range. That check does NOT require an exact match --
    # adding more in-range coverage here (e.g. a real mid-range release)
    # is always fine. When widening the specifier's ceiling in
    # pyproject.toml, also add the actual highest minidump release that
    # now falls in range (check PyPI -- don't invent a version number
    # that may not exist).
    needs: plan
    # Auxiliary gate: full tier only (pull requests, main, manual
    # dispatch). The pre-PR fast lane deliberately skips it -- packaging
    # metadata and the minidump pin change on the order of once a
    # release, not once a work-in-progress commit.
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minidump-version: ["0.0.24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dumpex with dev extras
        run: pip install -e ".[dev]"

      - name: Pin minidump to ${{ matrix.minidump-version }}
        run: pip install "minidump==${{ matrix.minidump-version }}"

      - name: Verify the pinned version actually installed
        # `pip install` can exit 0 while printing a dependency-conflict
        # warning rather than actually installing the requested pin --
        # check installed metadata directly instead of trusting the exit
        # code alone.
        run: |
          python -c "
          import importlib.metadata as m
          installed = m.version('minidump')
          expected = '${{ matrix.minidump-version }}'
          assert installed == expected, f'expected minidump=={expected}, got {installed}'
          "

      - name: Import dumpex.core.memory (module-level import path)
        run: python -c "import dumpex.core.memory"

      - name: Handle-stream descriptor layout + parsing suite (exercises _handle_descriptor_layout())
        run: pytest tests/unit/test_handle_stream_parse.py -v

  minidump-version-pin-consistency:
    # Runs tests/unit/test_minidump_version_pin.py on its own, outside
    # the main pytest job's matrix, so this specific drift check (CI
    # matrix above vs. pyproject.toml's specifier) shows up as its own
    # named, easy-to-spot job rather than one assertion buried in a much
    # larger test run.
    needs: plan
    # Auxiliary gate: full tier only (pull requests, main, manual
    # dispatch). The pre-PR fast lane deliberately skips it -- packaging
    # metadata and the minidump pin change on the order of once a
    # release, not once a work-in-progress commit.
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev extras (packaging, pyyaml, pytest)
        run: pip install -e ".[dev]"

      - name: minidump version pin <-> CI matrix consistency
        run: pytest tests/unit/test_minidump_version_pin.py -v

  package-smoke:
    # The pytest job above always installs dumpex editable (`pip install
    # -e .`), which never exercises setuptools' actual package-data
    # inclusion logic -- an editable install just symlinks/points back at
    # the checkout, so a package-data glob typo'd in pyproject.toml (or a
    # resource that silently stopped being packaged) would never be
    # caught by that job passing. This job builds the real wheel and
    # sdist artifacts, installs each into its own throwaway venv with NO
    # editable/dev install anywhere in the picture, and proves the
    # packaged rules.yaml / YARA rules / JSON schema are actually inside
    # the distributed artifact and readable via importlib.resources --
    # not just present in the source tree.
    needs: plan
    # Auxiliary gate: full tier only (pull requests, main, manual
    # dispatch). The pre-PR fast lane deliberately skips it -- packaging
    # metadata and the minidump pin change on the order of once a
    # release, not once a work-in-progress commit.
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build

      - name: Copy smoke script outside the checkout
        # The smoke test MUST run from a directory that does not contain a
        # `dumpex/` source folder: Python adds the invoked script's own
        # directory to sys.path ahead of site-packages, so running this
        # script from inside the checkout would silently import the
        # repo's source tree instead of the installed wheel/sdist even if
        # the install itself were broken -- defeating the entire point of
        # this job. See scripts/package_smoke.py's own docstring.
        run: cp scripts/package_smoke.py "$RUNNER_TEMP/package_smoke.py"

      - name: Wheel — install into a fresh venv and run the smoke test
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv "$RUNNER_TEMP/venv-wheel"
          "$RUNNER_TEMP/venv-wheel/bin/pip" install --quiet "$GITHUB_WORKSPACE"/dist/*.whl
          "$RUNNER_TEMP/venv-wheel/bin/python" "$RUNNER_TEMP/package_smoke.py" "$GITHUB_WORKSPACE"

      - name: Sdist — install into a fresh venv and run the smoke test
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv "$RUNNER_TEMP/venv-sdist"
          "$RUNNER_TEMP/venv-sdist/bin/pip" install --quiet "$GITHUB_WORKSPACE"/dist/*.tar.gz
          "$RUNNER_TEMP/venv-sdist/bin/python" "$RUNNER_TEMP/package_smoke.py" "$GITHUB_WORKSPACE"
