name: Private Corpus Regression

on:
  workflow_dispatch:
    inputs:
      corpus_version:
        description: "Optional private corpus version directory (for example 2026.08.1)"
        required: false
        type: string
  schedule:
    # Saturday 04:00 AEST / 05:00 AEDT.
    - cron: "0 18 * * 5"

concurrency:
  group: private-corpus-regression
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  corpus:
    # This runner must not accept fork PR workloads or execute submitted EXEs.
    # It analyzes DMP data only and should be disposable or restored after use.
    runs-on: [self-hosted, windows, x64, dumpex-corpus, isolated]
    environment: malware-lab
    timeout-minutes: 45

    env:
      CORPUS_SOURCE: ${{ vars.DUMPEX_CORPUS_SOURCE }}
      DEFAULT_CORPUS_VERSION: ${{ vars.DUMPEX_CORPUS_VERSION }}
      REQUESTED_CORPUS_VERSION: ${{ inputs.corpus_version }}

    steps:
      - name: Refuse non-default-branch execution
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $trustedRef = "refs/heads/$env:DEFAULT_BRANCH"
          if ($env:GITHUB_REF -ne $trustedRef) {
            throw "Private corpus jobs may run only from $trustedRef (got $env:GITHUB_REF)"
          }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dumpex and test dependencies
        run: python -m pip install -e ".[dev,full]"

      - name: Remove stale materialized corpus
        shell: pwsh
        run: python scripts/corpus_manager.py cleanup --root tests/corpus --yes

      - name: Materialize validated private corpus
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CORPUS_SOURCE)) {
            throw "Configure DUMPEX_CORPUS_SOURCE in the protected malware-lab environment"
          }

          $corpusVersion = $env:REQUESTED_CORPUS_VERSION
          if ([string]::IsNullOrWhiteSpace($corpusVersion)) {
            $corpusVersion = $env:DEFAULT_CORPUS_VERSION
          }

          $managerArgs = @(
            "scripts/corpus_manager.py",
            "materialize",
            "--source", $env:CORPUS_SOURCE,
            "--destination", "tests/corpus",
            "--require-kind", "evil"
          )
          if (-not [string]::IsNullOrWhiteSpace($corpusVersion)) {
            $managerArgs += @("--version", $corpusVersion)
          }
          python @managerArgs

      - name: Run FP and FN corpus gates
        shell: pwsh
        env:
          DUMPEX_CORPUS_MANIFEST: tests/corpus
        run: |
          python -m pytest tests/integration/test_corpus.py `
            -q `
            --tb=short `
            --junitxml="$env:RUNNER_TEMP\corpus-results.xml"

      - name: Upload sanitized JUnit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-results-${{ github.run_id }}
          path: ${{ runner.temp }}/corpus-results.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove private corpus from workspace
        if: always()
        shell: pwsh
        run: python scripts/corpus_manager.py cleanup --root tests/corpus --yes
